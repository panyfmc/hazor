<div class="mx-auto w-full p-8">

  <!-- HEADER -->
  <div class="mb-6">

    <h1 class="text-3xl font-bold text-slate-900">
      Alunos
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Gerencie participantes das oficinas e projetos.
    </p>

  </div>

  <!-- FILTROS -->
  <section
    class="mb-6 rounded-3xl border border-white/70 bg-white/70 p-6 backdrop-blur-xl shadow-[0_8px_30px_rgba(59,130,246,0.08)]">

    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">

      <!-- PESQUISA -->
      <div class="w-full lg:max-w-2xl">

        <input
          type="text"
          placeholder="Pesquisar por nome, igreja ou região"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-5 py-4 text-sm outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-100">

      </div>

      <!-- BOTÃO -->
      <button
        class="rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-400 px-5 py-3 font-medium text-white transition hover:scale-[1.02]">

        Novo Aluno

      </button>

    </div>

    <!-- CHIPS -->
    <div class="mt-5 flex flex-wrap gap-3">

      <button
        class="rounded-2xl bg-blue-500 px-5 py-2.5 text-sm font-medium text-white">

        Todos

      </button>

      <button
        class="rounded-2xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-600">

        Oficina

      </button>

      <button
        class="rounded-2xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-600">

        Mídia

      </button>

    </div>

  </section>
  
     <!-- RESPONSIVIDADE DOS CARDS -->
  <div
    class="grid gap-6"
     style="grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));">

    @for(aluno of alunos; track aluno.nome){

        <app-aluno-card

        [nome]="aluno.nome"
        [igreja]="aluno.igreja"
        [regiao]="aluno.regiao"
        [dataIngresso]="aluno.dataIngresso"
        [frequenciaAtual]="aluno.frequenciaAtual"
        [frequenciaMeta]="aluno.frequenciaMeta"

        [atividadesAtual]="aluno.atividadesAtual"
        [atividadesMeta]="aluno.atividadesMeta"

        [grupo]="aluno.grupo">

        </app-aluno-card>

    }

    </div>

</div>
