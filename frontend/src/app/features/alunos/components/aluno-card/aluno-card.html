<div
  class="group overflow-hidden rounded-3xl
         border border-white/70
         bg-white/70
         backdrop-blur-xl
         transition-all duration-300
         hover:-translate-y-1
         hover:shadow-[0_15px_40px_rgba(59,130,246,0.15)]">

  <!-- brilho superior -->
  <div
    class="h-1 bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-600">
  </div>

  <div class="p-6">

    <!-- HEADER -->

    <div class="flex items-start justify-between">

      <div>
        <h3 class="text-lg font-bold text-slate-900">
          {{ nomeCompleto }}
        </h3>
      </div>

      <div class="flex items-center gap-2">
        
        <span
          class="rounded-full px-3 py-1 text-xs font-semibold"
          [ngClass]="{
            'bg-green-100 text-green-700' : grupo.toLowerCase() === 'oficina',
            'bg-violet-100 text-violet-700' : grupo.toLowerCase() === 'cpm',
            'bg-blue-100 text-blue-700' : grupo.toLowerCase() === 'mídia' || grupo.toLowerCase() === 'midia'
          }">
          {{ grupo }}
        </span>

        <!-- <button 
          type="button"
          class="rounded-full p-1.5 text-slate-500 hover:bg-slate-100 cursor-pointer hover:text-slate-700 transition-colors focus:outline-none">
          
          <i class="pi pi-ellipsis-v"></i>
        </button> -->
        <button 
          (click)="toggleMenu($event)"
          type="button"
          class="rounded-full p-1.5 text-slate-500 hover:bg-slate-100 cursor-pointer hover:text-slate-700 transition-colors focus:outline-none">
          <i class="pi pi-ellipsis-v"></i>
        </button>

        <div *ngIf="isMenuOpen" 
             class="absolute right-0 top-10 z-50 w-40 rounded-xl border border-slate-100 bg-white p-1 shadow-xl normal-case">
          <button 
            (click)="onEdit()"
            type="button"
            class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 cursor-pointer">
            <i class="pi pi-pencil text-slate-400"></i>
            Editar
          </button>
        </div>

      </div>

    </div>

    <!-- IGREJA E REGIÃO -->

    <div class="mt-4">

        <p class="text-xs uppercase tracking-wider text-slate-400">
            Local
        </p>

        <p class="mt-1 text-sm font-medium text-slate-600">
            {{ igreja }} • {{ regiao }}
        </p>

    </div>

    <div class="mt-4">

        <p class="text-xs uppercase tracking-wider text-slate-400">
            Ingresso
        </p>

        <p class="mt-1 text-sm font-medium text-slate-700">
            {{ dataIngresso | date:'dd/MM/yyyy' }}
        </p>

    </div>

    <!-- FREQUÊNCIA -->

    <div class="mt-5">

      <div
        class="mb-2 flex items-center justify-between">

        <span
          class="text-xs font-semibold uppercase text-slate-400">

          Frequência

        </span>

        <span
          class="text-sm font-semibold text-slate-700">

          {{ frequenciaAtual }}/{{ frequenciaMeta }}

        </span>

      </div>

      <div
        class="h-2 overflow-hidden rounded-full bg-slate-100">
        <div
          class="h-full rounded-full bg-gradient-to-r from-blue-500 to-cyan-400" style="width: 85%">
        </div>
      </div>

    </div>

    <!-- ATIVIDADES -->

    <div class="mt-5">

      <div
        class="mb-2 flex items-center justify-between">

        <span
          class="text-xs font-semibold uppercase text-slate-400">
          Atividades
        </span>

        <span
          class="text-sm font-semibold text-slate-700">

          {{ atividadesAtual }}/{{ atividadesMeta }}

        </span>

      </div>

      <div
        class="h-2 overflow-hidden rounded-full bg-slate-100">

        <div
          class="h-full rounded-full bg-gradient-to-r from-cyan-400 to-blue-500"
          style="width: 70%">
        </div>

      </div>

    </div>

  </div>

</div>
