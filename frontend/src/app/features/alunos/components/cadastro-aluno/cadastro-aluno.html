<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="fecharModal()"></div>

  <div class="relative w-full max-w-lg rounded-3xl border border-slate-100 bg-white p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
    
    <div class="mb-5 flex items-center justify-between">
      <h3 class="text-xl font-bold text-slate-900">Cadastrar Novo Aluno</h3>
      <button (click)="fecharModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" #alunoForm="ngForm" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
        <input type="text" [(ngModel)]="novoAluno.nome" name="nome" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Igreja</label>
          <input type="text" [(ngModel)]="novoAluno.igreja" name="igreja" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Região</label>
          <input type="text" [(ngModel)]="novoAluno.regiao" name="regiao" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Data de Ingresso</label>
          <input type="date" [(ngModel)]="novoAluno.dataIngresso" name="dataIngresso" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Grupo</label>
          <select [(ngModel)]="novoAluno.grupo" name="grupo" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            <option value="OFICINA">Oficina</option>
            <option value="MIDIA">Mídia</option>
          </select>
        </div>
      </div>

      

      <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="fecharModal()" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 cursor-pointer">
          Cancelar
        </button>
        <button type="submit" [disabled]="!alunoForm.form.valid" class="rounded-xl bg-blue-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          Salvar Aluno
        </button>
      </div>

    </form>
  </div>
</div>
