<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="fecharModal()"></div>

  <div class="relative w-full max-w-lg rounded-3xl border border-slate-100 bg-white p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
    
    <div class="mb-5 flex items-center justify-between">
      <h3 class="text-xl font-bold text-slate-900">Cadastrar Novo Aluno</h3>
      <button (click)="fecharModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 cursor-pointer">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- FORMS  -->

    <form
      (ngSubmit)="onSubmit()"
      #alunoForm="ngForm"
      class="space-y-4">

      <!-- NOME -->

      <div>

        <label
          class="mb-1 block text-sm font-medium text-slate-700">
          Nome Completo
        </label>

        <input
          type="text" name="nomeCompleto" [(ngModel)]="formulario.nomeCompleto" required
          class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

      </div>

      <!-- REGIAO -->

      <div>

        <label
          class="mb-1 block text-sm font-medium text-slate-700">
          Região
        </label>

        <div class="relative w-full">
          <button
            type="button"
            (click)="toggleDropdownRegiao()"
            class="flex w-full items-center cursor-pointer justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            
            <span>
              {{ getRegiaoSelecionadaNome() }}
            </span>
            
            <svg class="h-4 w-4 text-gray-500 transition-transform" [class.rotate-180]="dropdownRegiaoAberto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>

          @if (dropdownRegiaoAberto) {
            <div class="absolute z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white p-1 shadow-lg animate-fadeIn">
              
              <button
                type="button"
                (click)="selecionarRegiao(0)"
                class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-500 hover:bg-slate-100">
                Selecione uma região
              </button>

              @for(regiao of regioes; track regiao.id){
                <button
                  type="button"
                  (click)="selecionarRegiao(regiao.id)"
                  class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                  [class.bg-blue-50]="formulario.regiaoId === regiao.id"
                  [class.font-medium]="formulario.regiaoId === regiao.id">
                  {{ regiao.nome }}
                </button>
              }
            </div>
          }
        </div>


      </div>

      <!-- IGREJA -->

      <div>

        <label
          class="mb-1 block text-sm font-medium text-slate-700">
          Igreja
        </label>

        <div class="relative w-full">
          <button
            type="button"
            (click)="toggleDropdownIgreja()"
            class="flex w-full items-center cursor-pointer justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            
            <span>
              {{ getIgrejaSelecionadaNome() }}
            </span>
            
            <svg class="h-4 w-4 text-gray-500 transition-transform" [class.rotate-180]="dropdownIgrejaAberto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>

          @if (dropdownIgrejaAberto) {
            <div class="absolute z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white p-1 shadow-lg animate-fadeIn">
              
              <button
                type="button"
                (click)="selecionarIgreja(null)"
                class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-500 hover:bg-slate-100">
                Selecione uma igreja
              </button>

              @for(igreja of igrejas; track igreja.id){
                <button
                  type="button"
                  (click)="selecionarIgreja(igreja.id)"
                  class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                  [class.bg-blue-50]="formulario.igrejaId === igreja.id"
                  [class.font-medium]="formulario.igrejaId === igreja.id">
                  {{ igreja.nome }}
                </button>
              }
            </div>
          }
        </div>



      </div>

      <!-- DATA E GRUPO -->

      <div class="grid grid-cols-2 gap-4">

        <div>

          <label
            class="mb-1 block text-sm font-medium text-slate-700">

            Data de Ingresso

          </label>

          <input
            type="date" name="dataIngresso" [(ngModel)]="formulario.dataIngresso" required
            class="w-full rounded-xl cursor-pointer border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

        </div>

        <div>

          <label
            class="mb-1 block text-sm font-medium text-slate-700">
            Grupo
          </label>

          <div class="relative w-full">
            <button
              type="button"
              (click)="toggleDropdownGrupo()"
              class="flex w-full cursor-pointer items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
              
              <span>
                {{ getGrupoSelecionadaNome() }}
              </span>
              
              <svg class="h-4 w-4 text-gray-500 transition-transform" [class.rotate-180]="dropdownGrupoAberto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </button>

            @if (dropdownGrupoAberto) {
              <div class="absolute z-50 mt-1 max-h-60 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white p-1 shadow-lg animate-fadeIn">
                
                <button
                  type="button"
                  (click)="selecionarGrupo(null)"
                  class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-500 hover:bg-slate-100">
                  Selecione
                </button>

                @for(grupo of grupos; track grupo.id){
                  <button
                    type="button"
                    (click)="selecionarGrupo(grupo.id)"
                    class="w-full text-left rounded-lg px-3 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                    [class.bg-blue-50]="formulario.grupoId === grupo.id"
                    [class.font-medium]="formulario.grupoId === grupo.id">
                    {{ grupo.nome }}
                  </button>
                }
              </div>
            }
          </div>

        </div>

      </div>

      <!-- BOTOES -->

      <div
        class="mt-6 flex justify-end gap-3 border-t border-slate-100 pt-4">

        <button
          type="button"
          (click)="fecharModal()"
          class="cursor-pointer rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50">
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="!alunoForm.form.valid"
          (click)="$event.stopPropagation()"
          class="cursor-pointer rounded-xl bg-blue-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-50">
          Salvar Aluno
        </button>

      </div>

    </form>   

    
  </div>
</div>
