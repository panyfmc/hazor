<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="fecharModal()"></div>

    <div class="relative w-full max-w-lg rounded-3xl border border-slate-100 bg-white p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
        
        <div class="mb-5 flex items-center justify-between">
            <h3 class="text-xl font-bold text-slate-900">Cadastrar Nova Temporada</h3>
            <button (click)="fecharModal()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 cursor-pointer">
                <i class="pi pi-times"></i>
            </button>
        </div>

        <form
            (ngSubmit)="onSubmit()"
            #alunoForm="ngForm"
            class="space-y-4">

            <!-- NOME -->

            <div>
                <label
                class="mb-1 block text-sm font-medium text-slate-700">
                Nome
                </label>

                <input
                type="text" name="Nome" [(ngModel)]="formulario.nome" required
                class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

            </div>

            <!-- DATA DE INICIO -->

            <div class="grid grid-cols-2 gap-4">

                <div>

                    <label
                    class="mb-1 block text-sm font-medium text-slate-700">

                    Data de Início

                    </label>

                    <input
                    type="date" name="dataInicio" [(ngModel)]="formulario.dataInicio" required
                    class="w-full rounded-xl cursor-pointer border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                </div>

            </div>

            <!-- BOTOES -->

            <div class="mt-6 flex justify-end gap-3 border-t border-slate-100 pt-4">

                <button
                type="button"
                (click)="fecharModal()"
                class="cursor-pointer rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50">
                Cancelar
                </button>

                <button
                type="submit"
                [disabled]="!alunoForm.form.valid"
                (click)="$event.stopPropagation()"
                class="cursor-pointer rounded-xl bg-blue-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-50">
                Salvar Aluno
                </button>
            </div>

        </form>   

        
    </div>
</div>
